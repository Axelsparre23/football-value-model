name: Match intelligence tests

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run match intelligence tests
        run: python -m unittest tests.test_match_intelligence
